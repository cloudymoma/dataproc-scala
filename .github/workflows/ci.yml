name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven (Scala 2.12 & 2.13)
      run: |
        mvn -B clean package -DskipTests -Pscala-2.12
        mvn -B package -DskipTests -Pscala-2.13

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: scala-jars
        path: target/*.jar
